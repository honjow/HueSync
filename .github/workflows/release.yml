name: Release

permissions:
  contents: write

on:
    workflow_dispatch:
    push:
        branches:
            - 'release/v3.10.0'
        tags:
            - 'v*.*.*'

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
        image: archlinux:latest
    steps:
      - name: set git global safe directory
        run: |
          pacman -Syu git npm python zip unzip --noconfirm
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v4
        with:
          ref: 7176803ce147d8bffef126720c21e4f42e0f3612

      - name: submodules
        run: |
          git submodule update --init --recursive py_modules

      - name: change log level
        run: |
          sed -i 's/logging.DEBUG/logging.INFO/' py_modules/config.py

      - name: build plugin
        run: |
          npm i -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc --noEmit --ignoreDeprecations 6.0
          python -m compileall -q main.py py_modules
          pnpm run build
          rm -f dist/*.map
          temp_dir=$(mktemp -d)
          temp_dir_zip=$(mktemp -d)
          
          # Prepare directory for tar.gz (preserves symlinks)
          mkdir -p $temp_dir/HueSync
          cp -r dist backend py_modules *.py *.json *.md *.js LICENSE $temp_dir/HueSync
          tar -czvf huesync.tar.gz -C $temp_dir HueSync
          
          # Prepare directory for zip (dereference symlinks for compatibility)
          mkdir -p $temp_dir_zip/HueSync
          cp -rL dist backend py_modules *.py *.json *.md *.js LICENSE $temp_dir_zip/HueSync
          (cd $temp_dir_zip && zip -r $OLDPWD/huesync.zip HueSync/)
      
      - name: Verify release version in both packages
        run: |
          python -c 'import json, tarfile, zipfile; expected = "3.10.0"; assert json.load(open("package.json"))["version"] == expected; assert json.load(tarfile.open("huesync.tar.gz").extractfile("HueSync/package.json"))["version"] == expected; assert json.loads(zipfile.ZipFile("huesync.zip").read("HueSync/package.json"))["version"] == expected'

      - name: show files
        run: |
          echo "=== tar.gz contents ==="
          tar -tzvf huesync.tar.gz | head -20
          echo ""
          echo "=== zip contents ==="
          unzip -l huesync.zip | head -20
      
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: huesync
          path: |
            huesync.tar.gz
            huesync.zip

  publish:
    if: github.ref == 'refs/heads/release/v3.10.0'
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/huesync/huesync.tar.gz
            /tmp/artifacts/huesync/huesync.zip
          tag_name: v3.10.0
          target_commitish: 7176803ce147d8bffef126720c21e4f42e0f3612
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
