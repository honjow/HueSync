name: Regression
on:
  push:
    branches:
      - main
      - 'fix/pr41-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize packaged submodules
        run: git submodule update --init --recursive py_modules
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc --noEmit --ignoreDeprecations 6.0
      - name: Build plugin
        run: pnpm run build
      - name: Python syntax check
        run: python -m compileall -q main.py py_modules
